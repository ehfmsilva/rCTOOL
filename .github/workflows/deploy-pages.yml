name: Deploy rCTOOL documentation

on:
  push:
    branches: [main]
    paths:
      - rctool-website.zip
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract the verified website
        run: |
          unzip -q rctool-website.zip -d _site-build
          test -f _site-build/rctool-website/docs/index.html
          test -f _site-build/rctool-website/docs/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site-build/rctool-website/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
